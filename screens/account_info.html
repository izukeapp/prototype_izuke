<head>

<body>
<div class="phone" style="background:var(--mist)">
  <div data-status></div>
  <div class="topbar"><a class="icon-btn plain" href="settings_account.html"><i class="ph ph-arrow-left"></i></a><span class="t">Account Info</span></div>

    <span class="label">Email</span><div class="input filled" style="background:var(--surface)">john@example.com</div>

    <div class="title-m mt20">Change Password</div>
    <span class="label mt12">New password</span><div class="input">••••••••</div>
    <span class="label mt12">Confirm password</span><div class="input">••••••••</div>
    <div class="mt20"><span class="btn primary">Update password</span></div>
  </div>
  <div data-home></div>
</div>
