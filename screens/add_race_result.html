<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izuke – Add a race result</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600&family=Bebas+Neue&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="../assets/proto.css">
<script src="../assets/proto.js"></script>
</head>
<body>
<div class="phone">
  <div data-status></div>
  <div class="topbar"><a class="icon-btn plain" href="races.html"><i class="ph ph-x"></i></a><span class="t">Add your result</span></div>
  <div class="body pad">
    <div class="card pad16 row gap12"><i class="ph-fill ph-medal" style="color:var(--amber);font-size:28px"></i><div class="grow"><div class="title-s">Techcombank HCMC Marathon</div><div class="t2 small">Ran 16 Nov · Half</div></div></div>
    <span class="label mt16">Distance you ran (km)</span><div class="input filled">21.1</div>
    <span class="label mt12">Finish time</span><div class="input focus filled" style="font:700 22px 'JetBrains Mono'">1:52:40</div>
    <div class="mt20"><span class="btn primary">Save result</span></div>
  </div>
  <div data-home></div>
</div>
<p class="proto-note">Pick one of your races and add your time.</p>
</body>
</html>
