<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izuke – Chat — after the run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600&family=Bebas+Neue&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="../assets/proto.css">
<script src="../assets/proto.js"></script>
</head>
<body>
<div class="phone">
  <div data-status></div>
  <div class="topbar"><a class="icon-btn plain" href="matches.html"><i class="ph ph-arrow-left"></i></a><span class="av s40 photo1"></span><div class="grow"><div class="title-s">Linh</div></div></div>
  <div class="divider"></div>
  <div class="body" style="padding:10px 14px">
    <div class="card" style="padding:14px">
      <div class="row" style="justify-content:space-between"><span class="mono" style="color:var(--success)">Run completed!</span><span class="pill grey">Completed</span></div>
      <div class="title-m mt8">You ran with Linh</div>
      <div class="stats mt12"><div class="stat"><div class="v">8.2</div><div class="k">km</div></div><div class="stat"><div class="v">5:28</div><div class="k">/km</div></div><div class="stat"><div class="v">44:51</div><div class="k">time</div></div></div>
      <div class="divider mt12"></div>
      <div class="list-row" style="padding:12px 0"><span class="ico berry"><i class="ph ph-hands-clapping"></i></span><div class="grow lbl" style="font-size:14px">How did the run go?</div><span class="pill green">Kudos given</span></div>
      <a class="list-row" href="moment_editor.html" style="padding:12px 0"><span class="ico berry"><i class="ph ph-image"></i></span><div class="grow lbl" style="font-size:14px">Create Moment</div><i class="ph ph-caret-right chev"></i></a>
    </div>
    <div class="bubble in mt12">That was fun!! Same time next week? 🙌</div>
  </div>
  <div class="composer"><span class="icon-btn"><i class="ph ph-plus"></i></span><span class="field">Message…</span><span class="send"><i class="ph-fill ph-paper-plane-right"></i></span></div>
  <div data-home></div>
</div>
<p class="proto-note">Once both confirm (or one tracked it), the checklist unlocks: rate the run and make a Moment.</p>
</body>
</html>
