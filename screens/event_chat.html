<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izuke – Event group chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600&family=Bebas+Neue&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="../assets/proto.css">
<script src="../assets/proto.js"></script>
</head>
<body>
<div class="phone">
  <div data-status></div>
  <div class="topbar"><a class="icon-btn plain" href="club_event_detail.html"><i class="ph ph-arrow-left"></i></a><div class="grow"><div class="title-s">Long Sunday</div><div class="t2 tiny">19 members</div></div><span class="icon-btn"><i class="ph ph-users"></i></span></div>
  <div style="margin:0 12px;padding:10px 12px;border-radius:12px;background:var(--berry-soft);font-size:12.5px" class="row gap8"><i class="ph-fill ph-push-pin berry"></i><span class="grow ellipsis" style="color:var(--heading)">Meet at the north entrance, 05:45. Bag drop available.</span></div>
  <div class="body" style="padding:10px 14px">
    <div class="row top gap8"><span class="av s32 g1">S</span><div><div class="t3 tiny">Saigon Run Club · Organiser</div><div class="bubble in">Pace groups: 5:30, 6:00 and 6:30. Pick yours below 👇</div></div></div>
    <div class="row top gap8 mt8"><span class="av s32 g2">M</span><div><div class="t3 tiny">Minh</div><div class="bubble in">6:00 for me</div></div></div>
    <div class="mt8"><div class="bubble out">Same, see you there!</div></div>
  </div>
  <div class="composer"><span class="icon-btn"><i class="ph ph-plus"></i></span><span class="field">Message the group…</span><span class="send"><i class="ph-fill ph-paper-plane-right"></i></span></div>
  <div data-home></div>
</div>
<p class="proto-note">For people who joined. Organisers can pin messages.</p>
</body>
</html>
