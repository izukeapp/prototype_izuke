<body>

  <div style="position:relative;z-index:3;padding:8px 16px 0">
    <div class="row" style="justify-content:space-between">
      <div class="row" style="gap:10px">
        <a class="map-btn" href="map_search.html"><i class="ph ph-magnifying-glass"></i></a>

      </div>
      <a class="map-runners" href="runners_nearby.html"><i class="ph ph-sneaker-move"></i>RUNNERS</a>

    <div class="map-goals" style="margin-top:14px">

  <a class="map-btn" style="position:absolute;right:23px;bottom:238px;z-index:3"><i class="ph ph-stack"></i></a>
  <a class="map-btn" style="position:absolute;right:23px;bottom:180px;z-index:3"><i class="ph ph-crosshair"></i></a>

  <div style="flex:1"></div>
  <nav data-tabbar="map"></nav>
  <div data-home></div>
</div>
<p class="proto-note">Home tab. Activities, club events and races near you; Runners opens the people nearby. Pins are the app's: a berry-ringed tile with the activity's emoji; a host can choose to show their face instead.</p>
