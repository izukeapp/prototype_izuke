<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izuke – Map — search a place</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600&family=Bebas+Neue&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="../assets/proto.css">
<script src="../assets/proto.js"></script>
</head>
<body>
<div class="phone">
  <div data-status></div>
  <div class="pad row gap10" style="padding-top:6px"><div class="input focus filled grow" style="min-height:46px"><i class="ph ph-magnifying-glass t2"></i>Hà Nội</div><a class="b berry" href="map_home.html">Cancel</a></div>
  <div class="body pad mt12">
    <div class="card">
      <div class="list-row"><span class="ico"><i class="ph ph-map-pin"></i></span><div class="grow"><div class="lbl">Hà Nội</div><div class="sub">Vietnam</div></div><span class="pill pro">PRO</span></div>
      <div class="list-row"><span class="ico"><i class="ph ph-map-pin"></i></span><div class="grow"><div class="lbl">Hoàn Kiếm</div><div class="sub">Hà Nội, Vietnam</div></div><span class="pill pro">PRO</span></div>
      <div class="list-row"><span class="ico"><i class="ph ph-map-pin"></i></span><div class="grow"><div class="lbl">Hà Đông</div><div class="sub">Hà Nội, Vietnam</div></div><span class="pill pro">PRO</span></div>
    </div>
    <p class="t3 small center mt16">Search a city or area to see its routes, events, and open runs</p>
  </div>
  <div data-home></div>
</div>
<p class="proto-note">Search any city or area to see what's there (other cities are Pro).</p>
</body>
</html>
