<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izuke – Moment editor — on the card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600&family=Bebas+Neue&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="../assets/proto.css">
<script src="../assets/proto.js"></script>
</head>
<body>
<div class="phone">
  <div data-status></div>
  <div class="body" style="display:flex;justify-content:center"><div class="img run" style="width:290px;aspect-ratio:9/16;border-radius:16px"></div></div>
  <div class="scrim"></div>
  <div class="sheet">
    <div class="grab"></div>
    <span class="label">On the card</span>
    <div class="chips" style="flex-wrap:wrap">
      <span class="chip on"><i class="ph-bold ph-check"></i>People</span><span class="chip on"><i class="ph-bold ph-check"></i>Stats</span><span class="chip">Date</span><span class="chip on"><i class="ph-bold ph-check"></i>Place</span>
    </div>
  </div>
</div>
<p class="proto-note">Show or hide everything this design can show — the only way to hide the date, people or stats.</p>
</body>
</html>
