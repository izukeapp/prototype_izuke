<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izuke – Moment — Story or Post</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600&family=Bebas+Neue&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">

<body>
<div class="phone">
  <div data-status></div>
  <div class="body"></div>
  <div class="scrim"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div class="title-m">Share as</div>
    <div class="card mt12">
      <div class="list-row"><span style="width:26px;height:42px;border-radius:5px;border:2px solid var(--berry);flex:none"></span><div class="grow"><div class="lbl">Story · 9:16</div><div class="sub">Instagram, Facebook and WhatsApp Status</div></div></div>
      <div class="list-row"><span style="width:30px;height:37px;border-radius:5px;border:2px solid var(--text2);flex:none"></span><div class="grow"><div class="lbl">Post · 4:5</div><div class="sub">Feed posts and chats</div></div></div>
    </div>
  </div>
</div>
<p class="proto-note">Asked on Share and on Save image. The post is the card's centre crop.</p>
</body>
