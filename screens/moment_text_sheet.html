<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izuke – Moment editor — text</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600&family=Bebas+Neue&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="../assets/proto.css">
<script src="../assets/proto.js"></script>
</head>
<body>
<div class="phone">
  <div data-status></div>
  <div class="body" style="display:flex;justify-content:center"><div class="img run" style="width:290px;aspect-ratio:9/16;border-radius:16px"></div></div>
  <div class="scrim"></div>
  <div class="sheet">
    <div class="grab"></div>
    <span class="label">Title</span><div class="input focus filled">Sunday Long Run</div><div class="t3 tiny" style="text-align:right;margin-top:4px">15/24</div>
    <div class="row" style="justify-content:space-between;margin-top:6px"><span class="label" style="margin:0">Place</span><span class="t2 small b">Remove from card</span></div><div class="input filled mt8">Thảo Điền</div>
    <div class="row" style="justify-content:space-between;margin-top:14px"><span class="label" style="margin:0">Shared Note</span><span class="berry small b">Add Note</span></div><div class="input area mt8" style="min-height:70px">How was the run?…</div>
    <div class="mt16"><a class="btn primary" style="height:48px;border-radius:14px" href="moment_editor.html">Done</a></div>
  </div>
</div>
<p class="proto-note">Any text pencil opens all the card's text, the tapped field focused. Each optional field can come off the card.</p>
</body>
</html>
