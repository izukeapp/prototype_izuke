<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izuke – Plan a run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600&family=Bebas+Neue&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="../assets/proto.css">
<script src="../assets/proto.js"></script>
</head>
<body>
<div class="phone">
  <div data-status></div>
  <div class="topbar"><span class="t">Linh</span></div>
  <div class="body"></div>
  <div class="scrim"></div>
  <div class="sheet" style="max-height:90%;overflow:auto">
    <div class="grab"></div>
    <div class="title-l">Plan a Run</div>
    <div class="row gap10 mt16"><div class="grow"><span class="label">Date</span><div class="input filled">Tue, 11 Nov</div></div><div class="grow"><span class="label">Time</span><div class="input filled">06:00</div></div></div>
    <span class="label mt12">Meeting point</span><div class="input filled"><i class="ph ph-map-pin t2"></i>Thảo Điền riverside path</div>
    <span class="label mt12">Route / area (optional)</span><div class="input"><i class="ph ph-path"></i>Select a route</div>
    <span class="label mt12">Distance</span><div class="chips"><span class="chip">5K</span><span class="chip on">8K</span><span class="chip">10K</span><span class="chip">Custom</span></div>
    <span class="label mt12">Pace (optional)</span><div class="input filled">5:30 min/km</div>
    <div class="mt20"><a class="btn primary" href="chat_thread.html">Send Run Invite</a></div>
  </div>
</div>
<p class="proto-note">From a match chat: date, time, meeting point or route, distance, pace.</p>
</body>
</html>
