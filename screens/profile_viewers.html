<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izuke – Profile views</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600&family=Bebas+Neue&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="../assets/proto.css">
<script src="../assets/proto.js"></script>
</head>
<body>
<div class="phone">
  <div data-status></div>
  <div class="topbar"><a class="icon-btn plain" href="profile.html"><i class="ph ph-arrow-left"></i></a><span class="t">Profile views</span></div>
  <div class="body pad">
    <div class="card pad16 center"><div style="font:900 44px 'Hanken Grotesk';color:var(--heading)">12</div><div class="t2 small">12 runners viewed your profile</div><div class="t3 tiny">In the last 30 days</div></div>
    <div class="card mt12" style="position:relative;overflow:hidden">
      <div class="list-row" style="filter:blur(5px)"><span class="av s40 g3">T</span><div class="grow"><div class="lbl">Thảo</div><div class="sub">2 hours ago</div></div></div>
      <div class="list-row" style="filter:blur(5px)"><span class="av s40 g5">A</span><div class="grow"><div class="lbl">An</div><div class="sub">Yesterday</div></div></div>
      <div class="list-row" style="filter:blur(5px)"><span class="av s40 g2">M</span><div class="grow"><div class="lbl">Minh</div><div class="sub">Sat</div></div></div>
      <div style="position:absolute;inset:0;display:grid;place-items:center"><a class="btn primary sm" href="paywall.html" style="width:auto;padding:0 20px"><i class="ph-fill ph-crown"></i>Unlock with Pro</a></div>
    </div>
  </div>
  <div data-home></div>
</div>
<p class="proto-note">Everyone sees how many; Pro shows who.</p>
</body>
</html>
