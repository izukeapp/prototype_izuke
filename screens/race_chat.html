<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izuke – Race chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600&family=Bebas+Neue&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="../assets/proto.css">
<script src="../assets/proto.js"></script>
</head>
<body>
<div class="phone">
  <div data-status></div>
  <div class="topbar"><a class="icon-btn plain" href="race_detail.html"><i class="ph ph-arrow-left"></i></a><div class="grow"><div class="title-s">HCMC Marathon</div><div class="t2 tiny">6 runners in the chat</div></div><span class="icon-btn"><i class="ph ph-plus"></i></span></div>
  <div class="body" style="padding:10px 14px">
    <div class="row top gap8"><span class="av s32 g4">K</span><div><div class="t3 tiny">Khoa</div><div class="bubble in">Last long run this Sunday — anyone for 18 km at 5:40?</div></div></div>
    <div class="card mt8" style="padding:12px;margin-left:40px"><div class="mono berry">Posted a run</div><div class="title-s mt4">Sunday shake-out · 18 km</div><div class="t2 small">Sun 06:00 · Landmark 81</div><span class="btn xs primary mt8">Join</span></div>
    <div class="mt8"><div class="bubble out">I'm in!</div></div>
  </div>
  <div class="composer"><span class="icon-btn"><i class="ph ph-plus"></i></span><span class="field">Message…</span><span class="send"><i class="ph-fill ph-paper-plane-right"></i></span></div>
  <div data-home></div>
</div>
<p class="proto-note">Everyone training for the same race; anyone can post an open run here.</p>
</body>
</html>
