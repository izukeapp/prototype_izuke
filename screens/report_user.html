<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izuke – Report a runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600&family=Bebas+Neue&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="../assets/proto.css">
<script src="../assets/proto.js"></script>
</head>
<body>
<div class="phone">
  <div data-status></div>
  <div class="topbar"><a class="icon-btn plain" href="runner_profile.html"><i class="ph ph-x"></i></a><span class="t">Report Linh</span></div>
  <div class="body pad">
    <span class="label">What's the issue</span>
    <div class="card">
      <div class="list-row"><i class="ph ph-radio-button t3"></i><span class="grow">Harassment or hate speech</span></div>
      <div class="list-row"><i class="ph-fill ph-radio-button berry"></i><span class="grow b" style="color:var(--heading)">Fake or misleading profile</span></div>
      <div class="list-row"><i class="ph ph-radio-button t3"></i><span class="grow">Inappropriate behavior</span></div>
      <div class="list-row"><i class="ph ph-radio-button t3"></i><span class="grow">Safety concern</span></div>
      <div class="list-row"><i class="ph ph-radio-button t3"></i><span class="grow">Spam or scam</span></div>
      <div class="list-row"><i class="ph ph-radio-button t3"></i><span class="grow">Other</span></div>
    </div>
    <span class="label mt16">Details (optional)</span><div class="input area">Add anything that helps us review this report…</div>
    <div class="mt16" style="padding-bottom:30px"><span class="btn primary">Submit report</span></div>
  </div>
  <div data-home></div>
</div>
<p class="proto-note">Category plus optional details. The runner is blocked automatically.</p>
</body>
</html>
