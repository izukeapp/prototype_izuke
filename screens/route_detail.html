<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izuke – Route detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600&family=Bebas+Neue&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="../assets/proto.css">
<script src="../assets/proto.js"></script>
</head>
<body>
<div class="phone">
  <div class="map photo" style="height:300px;flex:none;position:relative"><svg viewBox="0 0 390 300" style="position:absolute;inset:0;width:100%;height:100%"><path d="M50 260 C100 200 140 220 180 160 S270 110 260 70 S330 40 350 60" fill="none" stroke="#A8114F" stroke-width="6" stroke-linecap="round"/></svg>
    <div style="position:absolute;inset:0 0 auto 0"><div data-status></div><div class="row" style="justify-content:space-between;padding:0 16px"><span class="icon-btn card"><i class="ph ph-arrow-left"></i></span><div class="row gap8"><span class="icon-btn card"><i class="ph ph-share-network"></i></span><span class="icon-btn card"><i class="ph-fill ph-bookmark-simple berry"></i></span></div></div></div></div>
  <div class="body pad" style="padding-top:16px">
    <div class="row gap6"><span class="pill green">Road</span><span class="pill grey">~1.4 km away</span><span class="pill berry">You ran this</span></div>
    <h1 class="title-xl mt8">Thảo Điền River Loop</h1>
    <div class="stats card pad16 mt12"><div class="stat"><div class="v">6.8</div><div class="k">km</div></div><div class="stat"><div class="v">4.6</div><div class="k">Safety</div></div><div class="stat"><div class="v">31</div><div class="k">Runs</div></div></div>
    <div class="card pad16 mt12"><div class="mono">Safety</div><div class="row mt8"><span class="grow small">Well lit</span><b class="berry">92%</b></div><div class="progress mt4"><span style="width:92%"></span></div><div class="row mt8"><span class="grow small">Low traffic</span><b class="berry">78%</b></div><div class="progress mt4"><span style="width:78%"></span></div></div>
    <div class="card pad16 mt12" style="margin-bottom:20px"><div class="mono">Comments</div><div class="row top gap10 mt8"><span class="av s32 g2">M</span><div><b class="small" style="color:var(--heading)">Minh</b><p class="small t2">Great at sunrise, shady most of the way.</p></div></div></div>
  </div>
  <div data-home></div>
</div>
<p class="proto-note">A community route: distance, surface, safety ratings and comments. Save it to follow it on a run.</p>
</body>
</html>
