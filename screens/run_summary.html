<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izuke – Save your run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600&family=Bebas+Neue&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="../assets/proto.css">
<script src="../assets/proto.js"></script>
</head>
<body>
<div class="phone">
  <div data-status></div>
  <div class="topbar"><span class="icon-btn plain"><i class="ph ph-x"></i></span><span class="t">Save your run</span><span class="b" style="color:var(--danger);font-size:14px">Discard</span></div>
  <div class="body pad">
    <div class="map photo" style="height:220px;border-radius:20px;position:relative;overflow:hidden"><svg viewBox="0 0 350 220" style="position:absolute;inset:0;width:100%;height:100%"><path d="M40 190 C80 140 110 160 140 110 S220 70 210 40 S270 20 300 30" fill="none" stroke="#A8114F" stroke-width="5" stroke-linecap="round"/></svg></div>
    <div class="stats card pad16 mt12"><div class="stat"><div class="v">5.24</div><div class="k">km</div></div><div class="stat"><div class="v">28:41</div><div class="k">Time</div></div><div class="stat"><div class="v">5:28</div><div class="k">Pace /km</div></div></div>
    <span class="label mt16">Name</span><div class="input focus filled">Evening run</div>
  </div>
  <div class="pad" style="padding-bottom:40px"><a class="btn primary" href="my_runs.html">Save run</a></div>
  <div data-home></div>
</div>
<p class="proto-note">After Finish: name it and save. (Sharing it as a route post is switched off at launch.)</p>
</body>
</html>
