<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izuke – Safe Meetup — send your link</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600&family=Bebas+Neue&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="../assets/proto.css">
<script src="../assets/proto.js"></script>
</head>
<body>
<div class="phone">
  <div data-status></div>
  <div class="body"></div>
  <div class="scrim"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div class="title-l">Send your live link</div>
    <p class="t2 small mt4">Your friend can follow you until 22:00. No app needed.</p>
    <div class="card mt16">
      <div class="list-row"><span class="ico berry"><i class="ph ph-address-book"></i></span><div class="grow"><div class="lbl">Text all my emergency contacts</div><div class="sub">Mai, Tuấn</div></div><i class="ph ph-caret-right chev"></i></div>
      <div class="list-row"><span class="ico"><i class="ph ph-share-network"></i></span><div class="grow lbl">Share another way</div><i class="ph ph-caret-right chev"></i></div>
    </div>
    <div class="mt16"><a class="btn ghost" href="safe_banner.html">Done</a></div>
  </div>
</div>
<p class="proto-note">Text it to your emergency contacts in one tap, or share another way (WhatsApp, Zalo…).</p>
</body>
</html>
