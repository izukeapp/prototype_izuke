<body>
<div class="phone" style="background:var(--mist)">

  <div class="topbar"><a class="icon-btn plain" href="settings.html"><i class="ph ph-arrow-left"></i></a><span class="t">Discovery &amp; privacy</span></div>
  <div class="body pad">

    </div>
  </div>
  <div data-home></div>
