<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izuke – SOS — countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600&family=Bebas+Neue&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="../assets/proto.css">
<script src="../assets/proto.js"></script>
</head>
<body>
<div class="phone" style="background:#7A0E0E">
  <div data-status="light"></div>
  <div class="body col" style="align-items:center;justify-content:center;text-align:center;color:#fff">
    <div style="width:200px;height:200px;border-radius:50%;border:8px solid rgba(255,255,255,.25);display:grid;place-items:center;position:relative"><div style="position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(#fff 60%,transparent 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 8px),#000 0)"></div><span style="font:900 84px 'Hanken Grotesk'">3</span></div>
    <div class="mt24" style="font:800 24px 'Hanken Grotesk'">Sending SOS in 3</div>
    <p class="mt8" style="opacity:.8;max-width:260px">Your friend's page will show SOS and your emergency contacts will be texted.</p>
    <a class="btn white mt24" href="safe_controls.html" style="width:220px">Cancel</a>
  </div>
  <a href="sos_sent.html" style="position:absolute;inset:0;z-index:1;opacity:0"></a>
  <div data-home></div>
</div>
<p class="proto-note">After holding SOS: 5 seconds to cancel before it sends.</p>
</body>
</html>
