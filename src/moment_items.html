<!-- title: Moment editor — on the card | group: Moments | order: 25 | note: Show or hide everything this design can show — the only way to hide the date, people or stats. -->
<div class="phone">
  <div data-status></div>
  <div class="body" style="display:flex;justify-content:center"><div class="img run" style="width:290px;aspect-ratio:9/16;border-radius:16px"></div></div>
  <div class="scrim"></div>
  <div class="sheet">
    <div class="grab"></div>
    <span class="label">On the card</span>
    <div class="chips" style="flex-wrap:wrap">
      <span class="chip on"><i class="ph-bold ph-check"></i>People</span><span class="chip on"><i class="ph-bold ph-check"></i>Stats</span><span class="chip">Date</span><span class="chip on"><i class="ph-bold ph-check"></i>Place</span>
    </div>
  </div>
</div>
