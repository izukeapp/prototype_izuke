<!-- title: Filter runners | group: Map | order: 45 | note: Pace, distance, how far, trust and age. With women-only mode on, Show is locked to Women. -->
<div class="phone">
  <div data-status></div>
  <div class="topbar"><span class="t">Runners nearby</span></div>
  <div class="body"></div>
  <div class="scrim"></div>
  <div class="sheet" style="max-height:92%;overflow:auto">
    <div class="grab"></div>
    <div class="row" style="justify-content:space-between"><span class="title-l">Filter runners</span><span class="b berry">Reset</span></div>
    <span class="label mt16">Show</span><div class="chips"><span class="chip on">Everyone</span><span class="chip">Women</span><span class="chip">Men</span></div>
    <span class="label mt16">Pace</span><div class="chips"><span class="chip">Any</span><span class="chip on">Under 5:30</span><span class="chip">5:30–6:00</span><span class="chip">Over 6:00</span></div>
    <span class="label mt16">Typical distance</span><div class="chips"><span class="chip on">5K</span><span class="chip on">10K</span><span class="chip">Half</span><span class="chip">Marathon</span></div>
    <span class="label mt16">Distance from me</span><div class="card pad16"><div class="row" style="justify-content:space-between"><span class="b" style="color:var(--heading)">5 km</span><span class="t3 small">Any distance</span></div><div class="progress mt8" style="height:6px"><span style="width:30%"></span></div></div>
    <span class="label mt16">Trust</span><div class="card"><div class="list-row"><i class="ph-fill ph-seal-check verified" style="font-size:20px"></i><span class="grow lbl" style="font-size:14px">Verified runners only</span><span class="toggle on"></span></div><div class="list-row"><i class="ph ph-target t2" style="font-size:20px"></i><span class="grow lbl" style="font-size:14px">Shared goals</span><span class="toggle"></span></div></div>
    <span class="label mt16">Age range</span><div class="chips"><span class="chip on">Any age</span><span class="chip">25+</span><span class="chip">Up to 40</span></div>
    <div class="mt20"><a class="btn primary" href="runners_nearby.html">Show 8 runners</a></div>
  </div>
</div>
