<!-- title: SOS — sent | group: Safety | order: 60 | note: Emergency number for the country you're in, and texts to your contacts. The banner turns red. -->
<div class="phone">
  <div class="map photo" style="position:absolute;inset:0"></div>
  <div data-status style="position:relative;z-index:3"></div>
  <div class="scrim"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div class="row gap10"><i class="ph-fill ph-siren" style="color:var(--danger);font-size:26px"></i><span class="title-l" style="color:var(--danger)">SOS sent</span></div>
    <p class="t2 small mt8">Your friend's page now shows SOS with your live location.</p>
    <div class="col gap8 mt16">
      <span class="btn" style="background:var(--danger);color:#fff"><i class="ph-fill ph-phone"></i>Call 113 · Police</span>
      <span class="btn" style="background:var(--danger);color:#fff"><i class="ph-fill ph-phone"></i>Call 115 · Ambulance</span>
    </div>
    <div class="card mt12"><div class="list-row"><span class="ico berry"><i class="ph ph-address-book"></i></span><span class="grow lbl">Text my emergency contacts</span><i class="ph ph-caret-right chev"></i></div></div>
    <p class="t3 small mt12">Your phone's Emergency SOS also dials the local number automatically: hold the side button and a volume button.</p>
  </div>
</div>
